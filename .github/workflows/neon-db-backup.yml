name: Neon Secondary Database Backup

on:
  schedule:
    # Execute automated backup sync daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-db-backup
  cancel-in-progress: false

jobs:
  sync-neon-backup:
    name: Sync Primary Neon DB to Secondary Backup DB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate repository secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_BACKUP_DATABASE_URL: ${{ secrets.NEON_BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Missing required repository secret DATABASE_URL."
            exit 1
          fi

          if [ -z "${NEON_BACKUP_DATABASE_URL:-}" ]; then
            echo "::error::Missing required repository secret NEON_BACKUP_DATABASE_URL."
            exit 1
          fi

          if [ "${DATABASE_URL}" = "${NEON_BACKUP_DATABASE_URL}" ]; then
            echo "::error::NEON_BACKUP_DATABASE_URL must point to a secondary Neon database, not DATABASE_URL."
            exit 1
          fi

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql-client postgresql-common ca-certificates

      - name: Sync primary Neon PostgreSQL database to secondary backup and verify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_BACKUP_DATABASE_URL: ${{ secrets.NEON_BACKUP_DATABASE_URL }}
          PGSSLMODE: require
        run: |
          set -euo pipefail

          ensure_sslmode() {
            local url="$1"
            if [[ "$url" == *"sslmode="* ]]; then
              printf '%s' "$url"
            elif [[ "$url" == *"?"* ]]; then
              printf '%s&sslmode=require' "$url"
            else
              printf '%s?sslmode=require' "$url"
            fi
          }

          PRIMARY_URL="$(ensure_sslmode "${DATABASE_URL}")"
          BACKUP_URL="$(ensure_sslmode "${NEON_BACKUP_DATABASE_URL}")"

          echo "::add-mask::${PRIMARY_URL}"
          echo "::add-mask::${BACKUP_URL}"

          PRIMARY_BASE="${PRIMARY_URL%%\?*}"
          BACKUP_BASE="${BACKUP_URL%%\?*}"
          if [ "${PRIMARY_BASE}" = "${BACKUP_BASE}" ]; then
            echo "::error::Primary and secondary Neon base connection endpoints cannot be identical."
            exit 1
          fi

          # Ensure pg_dump major version matches or exceeds the primary Neon PostgreSQL server version
          CLIENT_MAJOR="$(pg_dump --version | grep -oE '[0-9]+(\.[0-9]+)?' | head -n 1 | cut -d. -f1)"
          SERVER_MAJOR="$(psql "${PRIMARY_URL}" -Atc "SELECT current_setting('server_version_num')::int / 10000;" | tr -d '[:space:]')"

          PG_BIN_DIR=""
          if [[ "${SERVER_MAJOR}" =~ ^[0-9]+$ ]] && [[ "${CLIENT_MAJOR}" =~ ^[0-9]+$ ]] && [ "${SERVER_MAJOR}" -gt "${CLIENT_MAJOR}" ]; then
            echo "Detected PostgreSQL ${SERVER_MAJOR} on primary Neon server (installed client is ${CLIENT_MAJOR}); installing postgresql-client-${SERVER_MAJOR}..."
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "postgresql-client-${SERVER_MAJOR}"
            PG_BIN_DIR="/usr/lib/postgresql/${SERVER_MAJOR}/bin/"
          fi

          PG_DUMP_BIN="${PG_BIN_DIR}pg_dump"
          PSQL_BIN="${PG_BIN_DIR}psql"

          echo "Using $("${PG_DUMP_BIN}" --version)"
          echo "Starting clean schema and data sync to secondary Neon backup database..."

          "${PG_DUMP_BIN}" \
            --clean \
            --if-exists \
            --no-owner \
            --no-privileges \
            "${PRIMARY_URL}" \
          | "${PSQL_BIN}" \
            --single-transaction \
            -v ON_ERROR_STOP=1 \
            "${BACKUP_URL}"

          echo "Database sync complete. Verifying tables, relations, row counts, and sequences..."

          PRIMARY_TABLES="$("${PSQL_BIN}" "${PRIMARY_URL}" -Atc "SELECT tablename FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename;")"
          BACKUP_TABLES="$("${PSQL_BIN}" "${BACKUP_URL}" -Atc "SELECT tablename FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename;")"

          if [ "${PRIMARY_TABLES}" != "${BACKUP_TABLES}" ]; then
            echo "::error::Synced table list mismatch between primary and secondary Neon databases."
            diff -u <(printf '%s\n' "${PRIMARY_TABLES}") <(printf '%s\n' "${BACKUP_TABLES}") || true
            exit 1
          fi

          PRIMARY_FK_COUNT="$("${PSQL_BIN}" "${PRIMARY_URL}" -Atc "SELECT count(*) FROM information_schema.table_constraints WHERE constraint_schema = 'public' AND constraint_type = 'FOREIGN KEY';")"
          BACKUP_FK_COUNT="$("${PSQL_BIN}" "${BACKUP_URL}" -Atc "SELECT count(*) FROM information_schema.table_constraints WHERE constraint_schema = 'public' AND constraint_type = 'FOREIGN KEY';")"

          if [ "${PRIMARY_FK_COUNT}" != "${BACKUP_FK_COUNT}" ]; then
            echo "::error::Foreign key constraint mismatch (primary=${PRIMARY_FK_COUNT}, backup=${BACKUP_FK_COUNT})."
            exit 1
          fi

          PRIMARY_SEQ_STATE="$("${PSQL_BIN}" "${PRIMARY_URL}" -Atc "SELECT sequencename || ':' || COALESCE(last_value::text, 'unused') || ':' || COALESCE(is_called::text, 'false') FROM pg_sequences WHERE schemaname = 'public' ORDER BY sequencename;")"
          BACKUP_SEQ_STATE="$("${PSQL_BIN}" "${BACKUP_URL}" -Atc "SELECT sequencename || ':' || COALESCE(last_value::text, 'unused') || ':' || COALESCE(is_called::text, 'false') FROM pg_sequences WHERE schemaname = 'public' ORDER BY sequencename;")"

          if [ "${PRIMARY_SEQ_STATE}" != "${BACKUP_SEQ_STATE}" ]; then
            echo "::error::Sequence state mismatch between primary and secondary Neon databases."
            diff -u <(printf '%s\n' "${PRIMARY_SEQ_STATE}") <(printf '%s\n' "${BACKUP_SEQ_STATE}") || true
            exit 1
          fi

          ROW_COUNT_SQL="
            SELECT table_name,
                   (xpath('/row/cnt/text()', query_to_xml(format('SELECT count(*) AS cnt FROM %I.%I', table_schema, table_name), false, true, '')))[1]::text::int AS row_count
            FROM information_schema.tables
            WHERE table_schema = 'public' AND table_type = 'BASE TABLE'
            ORDER BY table_name;
          "
          PRIMARY_ROWS="$("${PSQL_BIN}" "${PRIMARY_URL}" -Atc "${ROW_COUNT_SQL}")"
          BACKUP_ROWS="$("${PSQL_BIN}" "${BACKUP_URL}" -Atc "${ROW_COUNT_SQL}")"

          if [ "${PRIMARY_ROWS}" != "${BACKUP_ROWS}" ]; then
            echo "::error::Row count mismatch between primary and secondary Neon databases."
            diff -u <(printf '%s\n' "${PRIMARY_ROWS}") <(printf '%s\n' "${BACKUP_ROWS}") || true
            exit 1
          fi

          TABLE_TOTAL="$(printf '%s\n' "${BACKUP_TABLES}" | grep -c . || true)"
          echo "Verification passed: ${TABLE_TOTAL} tables, ${BACKUP_FK_COUNT} foreign key relations, and sequence states match cleanly."
